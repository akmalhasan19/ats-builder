    <script>
      // Tema dibaca sebelum paint pertama supaya tidak ada kedipan warna.
      // Kunci & nilai valid dijaga di src/features/theme/themes.ts.
      try {
        var theme = localStorage.getItem('vetra:theme')
        if (theme && /^[a-z]{3,12}$/.test(theme)) {
          document.documentElement.dataset.theme = theme
        }
      } catch (error) {
        // localStorage diblokir: tema default dari CSS tetap dipakai.
      }
    </script>
